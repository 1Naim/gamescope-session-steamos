name: Sync gamescope-session from Valve Jupiter

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Valve jupiter repo
        run: git clone https://github.com/evlaV/jupiter.git /tmp/jupiter

      - name: Get latest relevant gamescope commit
        id: upstream
        run: |
          cd /tmp/jupiter
          HASH=$(git log -n1 --format=%H -- \
            gamescope \
            ':(exclude)gamescope/PKGBUILD' \
            ':(exclude)gamescope/gamescope.install')
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Checkout gamescope-session-steamos
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace as safe for git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Read last synced commit
        id: last
        run: |
          if [ -f .upstream-jupiter-commit ]; then
            echo "hash=$(cat .upstream-jupiter-commit)" >> $GITHUB_OUTPUT
          else
            echo "hash=" >> $GITHUB_OUTPUT
          fi

      - name: Skip build if upstream unchanged
        if: steps.upstream.outputs.hash == steps.last.outputs.hash
        run: |
          echo "Upstream gamescope-session unchanged, skipping sync."
          exit 0

      - name: Bootstrap gamescope-session
        working-directory: /tmp/jupiter/gamescope
        run: |
          pkgdir=/tmp/pkgroot "$GITHUB_WORKSPACE/.github/sync-jupiter.sh"

      - name: Sync installed filesystem
        run: |
          mkdir -p usr
          rsync -av --delete \
            /tmp/pkgroot/usr/ \
            usr/

      - name: Update upstream commit record
        run: |
          echo "${{ steps.upstream.outputs.hash }}" > .github/.upstream-jupiter-commit

      - name: Commit and push updates
        run: |
          if git diff --quiet; then
            echo "No changes after sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SHORT_HASH=$(git rev-parse --short=12 "${{ steps.upstream.outputs.hash }}")
          DATE=$(date -u +%Y%m%d)

          LAST_RELEASE=$(git tag -l "${DATE}.*" \
            | sed -n "s/^${DATE}\.\([0-9]\+\)$/\1/p" \
            | sort -n \
            | tail -n 1)

          if [ -z "$LAST_RELEASE" ]; then
            RELEASE=1
          else
            RELEASE=$((LAST_RELEASE + 1))
          fi

          TAG="${DATE}.${RELEASE}"

          git add usr .github/.upstream-jupiter-commit
          git commit -m "sync: gamescope-session (jupiter ${SHORT_HASH})"

          git tag "$TAG"

          git push
          git push --tags
